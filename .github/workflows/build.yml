
name: Build ORISON Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build ORISON
        run: mvn -B -Pstandalone clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ORISON-Plugin
          path: target/orison-1.0.0.jar
          
