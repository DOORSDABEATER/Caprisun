
name: Build ORISON Plugin

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Maven Project
        id: project
        run: |
          POM=$(find . -name pom.xml -not -path '*/.git/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "ERROR: No pom.xml found!"
            exit 1
          fi
          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM"

      - name: Build ORISON
        run: mvn -B -f "${{ steps.project.outputs.pom }}" -Pstandalone clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ORISON-Plugin
          path: '**/target/*.jar'
          if-no-files-found: error
          
