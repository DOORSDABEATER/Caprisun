
name: Build ORISON Plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ORISON Source
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found!"
            exit 1
          fi

          echo "Extracting $ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Locate Maven Project
        id: project
        run: |
          POM=$(find extracted -name pom.xml | head -n 1)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml not found!"
            exit 1
          fi

          echo "pom=$POM" >> "$GITHUB_OUTPUT"

      - name: Build ORISON
        run: |
          mvn -B -f "${{ steps.project.outputs.pom }}" \
            -Pstandalone clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ORISON-Plugin
          path: extracted/**/target/*.jar
          if-no-files-found: error
          
