
name: Build DeS ORISON

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build ORISON standalone plugin
        run: mvn -B -ntp -Pstandalone clean package

      - name: Upload ORISON JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeS-ORISON
          path: target/orison-1.0.0.jar
          if-no-files-found: error
          
